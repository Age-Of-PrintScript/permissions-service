services:
    postgres:
        image: postgres:16-alpine
        container_name: permissions-postgres
        ports:
            - "5434:5432"
        environment:
            POSTGRES_DB: permission_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - permissions_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d permission_db"]
            interval: 5s
            timeout: 3s
            retries: 10

    app:
        build:
            context: .
            secrets:
                - gradle_properties
        container_name: permissions-service
        ports:
            - "8081:8080"
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/permission_db
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres #creo que tengo que cambiar esto
            NEW_RELIC_APP_NAME: "permission-service"
            NEW_RELIC_AGENT_ENABLED: "false"
            AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-ivkfg3acdd7t54se.us.auth0.com}
            AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://snippet-api-dev}
            AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
            AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
        depends_on:
            postgres:
                condition: service_healthy

secrets:
    gradle_properties:
        file: ${HOME}/.gradle/gradle.properties

volumes:
    permissions_postgres_data:
