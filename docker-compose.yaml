services:
    postgres:
        image: postgres:16-alpine
        container_name: permissions-postgres
        ports:
            - "5434:5432"
        environment:
            POSTGRES_DB: permission_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - permissions_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d permission_db"]
            interval: 5s
            timeout: 3s
            retries: 10

    app:
        build:
            context: .
            secrets:
                - gradle_properties
        container_name: permissions-service
        ports:
            - "8081:8080"
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/permission_db
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres #creo que tengo que cambiar esto
        depends_on:
            postgres:
                condition: service_healthy

secrets:
    gradle_properties:
        file: ${HOME}/.gradle/gradle.properties

volumes:
    permissions_postgres_data:
