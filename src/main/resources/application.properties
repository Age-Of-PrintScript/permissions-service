spring.application.name=snippet-permission

# Datasource configuration (with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/permission_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Auth0 (JWT resource server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}


# Auth0 Management API (M2M, opcional en local/tests)
auth0.domain=${AUTH0_DOMAIN}
auth0.management.client-id=${AUTH0_MGMT_CLIENT_ID:}
auth0.management.client-secret=${AUTH0_MGMT_CLIENT_SECRET:}
